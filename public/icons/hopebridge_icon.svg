<svg width="512" height="512" viewBox="0 0 512 512" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>HopeBridge Icon</title>

  <defs>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f47c50"/>
      <stop offset="100%" style="stop-color:#e0392d"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3a72c8"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="110" fill="#1a3a5c"/>

  <!-- ===== BRIDGE ICON centered ===== -->
  <g transform="translate(256, 256)">

    <!-- Water strip -->
    <rect x="-160" y="90" width="320" height="22" rx="11" fill="#4a8fd4" opacity="0.5"/>

    <!-- Bridge deck -->
    <rect x="-150" y="74" width="300" height="18" rx="3" fill="url(#bridgeGrad)"/>
    <rect x="-150" y="74" width="300" height="18" rx="3" fill="#3a72c8" opacity="0.4"/>

    <!-- Left tower -->
    <rect x="-120" y="-30" width="22" height="108" rx="3" fill="#4a8fd4"/>
    <rect x="-126" y="-40" width="34" height="14" rx="3" fill="#5aa0e0"/>

    <!-- Right tower -->
    <rect x="98" y="-30" width="22" height="108" rx="3" fill="#4a8fd4"/>
    <rect x="92" y="-40" width="34" height="14" rx="3" fill="#5aa0e0"/>

    <!-- Main cable arc -->
    <path d="M-109 -28 Q0 -90 109 -28" fill="none" stroke="#5aa0e0" stroke-width="5" stroke-linecap="round"/>

    <!-- Vertical suspenders -->
    <line x1="-75" y1="-56" x2="-75" y2="74" stroke="#5aa0e0" stroke-width="2.5" opacity="0.8"/>
    <line x1="-38" y1="-78" x2="-38" y2="74" stroke="#5aa0e0" stroke-width="2.5" opacity="0.8"/>
    <line x1="0"   y1="-86" x2="0"   y2="74" stroke="#5aa0e0" stroke-width="2.5" opacity="0.8"/>
    <line x1="38"  y1="-78" x2="38"  y2="74" stroke="#5aa0e0" stroke-width="2.5" opacity="0.8"/>
    <line x1="75"  y1="-56" x2="75"  y2="74" stroke="#5aa0e0" stroke-width="2.5" opacity="0.8"/>

    <!-- Heart above center -->
    <path d="M0,-118 C-5,-132 -28,-132 -28,-112 C-28,-94 0,-76 0,-76 C0,-76 28,-94 28,-112 C28,-132 5,-132 0,-118 Z"
          fill="url(#heartGrad)"/>
    <circle cx="-9" cy="-120" r="5" fill="white" opacity="0.3"/>

    <!-- Land banks -->
    <rect x="-185" y="76" width="36" height="14" rx="2" fill="#3a72c8"/>
    <rect x="149"  y="76" width="36" height="14" rx="2" fill="#3a72c8"/>
  </g>

</svg>
